name: Alertas XAU/USD

on:
  schedule:
    # Cada 5 min (mínimo permitido por GitHub Actions)
    # 6:00-22:00 UTC = 8:00-24:00 Madrid verano / 7:00-23:00 invierno
    - cron: '*/5 6-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerts.py

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add alert_state.json || true
          if git diff --quiet --cached; then
            echo "Sin cambios en el estado"
          else
            git commit -m "Update alert state [skip ci]"
            git push
          fi
